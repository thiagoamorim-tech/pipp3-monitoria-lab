<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonitorIA - Aluno</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div id="dashboard" class="dashboard">
            <div class="dash-header">
                <h2 id="aluno-nome">Carregando...</h2>
                <div class="xp-badge"><span id="aluno-xp">0</span> XP</div>
            </div>
            <p id="aluno-status" class="status-msg">Buscando diagnostico...</p>
            <div class="stats-grid">
                <div class="stat-box">
                    <span>Quizzes Respondidos</span>
                    <strong id="stat-total">0</strong>
                </div>
                <div class="stat-box">
                    <span>Media de Acertos</span>
                    <strong id="stat-media">0%</strong>
                </div>
            </div>
        </div>

        <div id="list-view">
            <h3>Trilha de Estudos (Iteracao 1)</h3>
            <div id="quiz-list" class="quiz-list">
                <div class="loading">Carregando quizzes...</div>
            </div>
        </div>

        <div id="quiz-view">
            <button class="back-btn" onclick="voltarParaLista()">Voltar para trilhas</button>
            <div id="question-text" class="question"></div>
            <div id="options-container" class="options"></div>
            <div id="feedback-box" class="feedback"></div>
        </div>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
